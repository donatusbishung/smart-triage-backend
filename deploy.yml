name: CD - Deploy to EC2

# Runs after a push to master. SSHes into the EC2 host and redeploys
# the stack by pulling the latest images and recreating the containers.

on:
  push:
    branches: [ master ]

  # Allows manual triggering from the GitHub Actions tab too
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/app

            echo "Pulling latest images..."
            docker compose pull

            echo "Recreating containers..."
            docker compose up -d --force-recreate

            echo "Cleaning up old images..."
            docker image prune -f

            echo "Running health check..."
            sleep 15
            curl -fsS -I http://localhost | head -1